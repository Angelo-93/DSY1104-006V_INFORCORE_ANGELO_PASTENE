spring.application.name=inforcore-backend

# Puerto del backend. El frontend (Vite) corre en el 5173 y llama a este.
server.port=8080

# ---------------------------------------------------------------------------
# Base de datos H2 en MODO ARCHIVO
# En clase se uso jdbc:h2:mem:... (en memoria), que se borra al apagar el
# servidor. Con "file" los datos quedan en backend/data/inforcore.mv.db y
# sobreviven al reinicio. Para volver a los datos iniciales: detener el
# servidor y borrar la carpeta backend/data.
# ---------------------------------------------------------------------------
# DB_CLOSE_ON_EXIT=FALSE: la base la cierra Spring al detener el servidor, no
# H2 por su cuenta (evita el error "Database is already closed" al apagar).
spring.datasource.url=jdbc:h2:file:./data/inforcore;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades y, si cambian, las
# actualiza sin borrar los datos (update, no create).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que genera Hibernate (clase del 03-11).
spring.jpa.show-sql=true

# Las entidades se convierten a DTO dentro de los servicios; la conexion a la
# base no se mantiene abierta mientras se arma la respuesta HTTP.
spring.jpa.open-in-view=false

# Consola web de H2 para revisar las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/inforcore - usuario: sa - sin contrasena)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
