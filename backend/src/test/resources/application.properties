# Configuracion SOLO para las pruebas (mvnw test o Run 'All Tests').
# Usa una base H2 en memoria: las pruebas parten siempre desde los datos
# iniciales y nunca tocan la base en archivo backend/data que usas al
# ejecutar la aplicacion.
spring.application.name=inforcore-backend-test
spring.datasource.url=jdbc:h2:mem:inforcore-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
